name: Build Android APK / AAB

# Manual trigger. Produces:
#   - Debug APK (no signing required) — sideloadable for testing
#   - Signed release AAB — what you upload to Play Console
#
# Signed releases need these repository Secrets (generated once via the
# "Initialize Android upload keystore" workflow):
#   ANDROID_KEYSTORE_BASE64
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
#
# Auto-upload to Play Console Internal Testing track also requires:
#   PLAY_SERVICE_ACCOUNT_JSON  (from Google Cloud → Service Accounts)
# When this secret is missing the upload step is skipped and the AAB
# is left as a workflow artifact for manual upload.
#
# -----------------------------------------------------------------------
# When do you actually need to run this?
# -----------------------------------------------------------------------
# The Capacitor WebView loads from `server_url` (default
# https://relay.averrow.com), so the Android app is effectively a thin
# shell over the deployed Pages build. Web-only changes (routes,
# components, worker endpoints, schema, styling) reach Android users
# the moment `deploy-ui` finishes — no new AAB, no Play review.
#
# You only need to cut a new AAB when something *native* changes:
#   - Add/remove a Capacitor plugin (camera, biometrics, push, etc.)
#   - New Android permission in AndroidManifest.xml
#   - App icon / splash bundled in the AAB
#   - targetSdkVersion bump (Play policy)
#   - applicationId or signing config change
#   - Cosmetic version bump for the store listing
#
# That means it's fine — and intended — to batch several native changes
# into one AAB. Don't trigger this workflow per commit; queue native
# changes up and ship them together to keep Play review churn down.
# Each AAB upload kicks off an independent Play review.

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "What to build"
        type: choice
        options: [debug-apk, release-aab]
        default: release-aab
      publish:
        description: "Auto-upload AAB to Play Internal Testing"
        type: boolean
        default: false
      server_url:
        description: "Capacitor server URL (the WebView loads from here; blank = bundle local assets)"
        required: false
        default: "https://relay.averrow.com"
      version_code:
        description: "Override versionCode (blank = auto, minutes since 2024-01-01)"
        required: false
        default: ""

concurrency:
  group: build-android
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0"

      - run: pnpm install --frozen-lockfile

      - name: Build web bundle
        working-directory: packages/relay-ui
        env:
          # Must match the env name api.ts reads. The Pages deploy uses
          # the same value.
          VITE_API_BASE_URL: https://relay-api.averrow.com
        run: pnpm exec vite build

      - name: Initialise Capacitor android project
        working-directory: packages/relay-ui
        env:
          CAPACITOR_SERVER_URL: ${{ github.event.inputs.server_url }}
          # The web OAuth client id, baked into capacitor.config.json as the
          # native Google Sign-In serverClientId. Must equal the worker's
          # GOOGLE_ID (the token audience it verifies). See ANDROID-AUTH.md.
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
        run: |
          set -euo pipefail
          if [ ! -d android ]; then
            echo "Generating android/ project (first build on this runner)"
            pnpm exec cap add android
          fi
          # Capacitor 6 still defaults to compileSdk/targetSdk 34. Google
          # Play now requires apps to target API 35 (Android 15). Bump
          # both via the generated variables.gradle.
          sed -i -E 's/compileSdkVersion = [0-9]+/compileSdkVersion = 35/' android/variables.gradle
          sed -i -E 's/targetSdkVersion = [0-9]+/targetSdkVersion = 35/' android/variables.gradle
          grep -E "compileSdkVersion|targetSdkVersion" android/variables.gradle
          # Declare CAMERA permission so the WebView's getUserMedia
          # (used by the in-app QR scanner) can trigger Android's
          # runtime permission prompt. Capacitor's BridgeWebChromeClient
          # auto-handles the WebView side once the manifest declares it.
          #
          # The two uses-feature lines are not optional: declaring the
          # CAMERA permission alone makes Google Play *imply*
          # `android.hardware.camera` is REQUIRED, which silently drops
          # every camera-less device (many tablets, TVs, emulators) from
          # the supported list — Play flagged ~431 such devices on the
          # first AAB to carry this permission. Marking the hardware
          # required=false keeps those devices eligible; the QR scanner
          # simply has nothing to open where there's no camera.
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q "android.permission.CAMERA" "$MANIFEST"; then
            sed -i 's#</manifest>#    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <uses-feature android:name="android.hardware.camera.autofocus" android:required="false" />\n</manifest>#' "$MANIFEST"
          fi
          grep -E "uses-permission|uses-feature" "$MANIFEST"
          # Native Google Sign-In (@codetrix-studio/capacitor-google-auth)
          # reads the web OAuth client id from this Android string resource.
          # Mirror the capacitor.config serverClientId so the plugin can
          # request an ID token with the audience the worker verifies. Empty
          # GOOGLE_WEB_CLIENT_ID (secret unset) skips it — native sign-in
          # then won't work; see ANDROID-AUTH.md.
          STRINGS=android/app/src/main/res/values/strings.xml
          if [ -n "${GOOGLE_WEB_CLIENT_ID:-}" ] && ! grep -q "server_client_id" "$STRINGS"; then
            sed -i "s#</resources>#    <string name=\"server_client_id\">${GOOGLE_WEB_CLIENT_ID}</string>\n</resources>#" "$STRINGS"
            echo "Injected server_client_id into strings.xml"
          else
            echo "WARNING: GOOGLE_WEB_CLIENT_ID unset — native Google Sign-In will not work"
          fi
          pnpm exec cap sync android

      - name: Wire native push (Firebase / google-services.json)
        working-directory: packages/relay-ui
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          # @capacitor/push-notifications needs Firebase on Android. The only
          # project-specific piece is google-services.json (downloaded from
          # the Firebase Console for the com.averrow.relay app) — Capacitor's
          # generated android/app/build.gradle already applies the
          # google-services Gradle plugin *conditionally on that file
          # existing*, and android/build.gradle already carries the
          # classpath. So we just drop the file in from a secret.
          #
          # When GOOGLE_SERVICES_JSON is unset we change NOTHING: the build is
          # byte-for-byte the known-good one, the push plugin still compiles
          # (its firebase-messaging dependency resolves from Maven), and native
          # push simply fails to register at runtime (the app surfaces that).
          # See ANDROID-PUSH.md.
          if [ -z "${GOOGLE_SERVICES_JSON:-}" ]; then
            echo "GOOGLE_SERVICES_JSON unset — native push (FCM) not wired into this build"
            exit 0
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          # Fail loudly if the secret isn't valid JSON for the right package,
          # rather than shipping an AAB whose Firebase init crashes.
          node -e '
            const j = JSON.parse(require("fs").readFileSync("android/app/google-services.json","utf8"));
            const pkgs = (j.client||[]).flatMap(c => (c.client_info?.android_client_info?.package_name)||[]);
            if (!pkgs.includes("com.averrow.relay")) {
              console.error("google-services.json has no com.averrow.relay client; packages="+JSON.stringify(pkgs));
              process.exit(1);
            }
            console.log("google-services.json OK for", pkgs.join(","));
          '

      - name: Generate native launcher icon + splash
        working-directory: packages/relay-ui
        run: |
          set -euo pipefail
          # `cap add android` scaffolds the project with Capacitor's DEFAULT
          # teal placeholder icon, and the web manifest icons never reach the
          # native launcher. This step is the single source of truth that
          # overwrites res/mipmap-* + splash drawables with the Relay mark.
          # It must run after the android/ project exists; `cap sync` does not
          # touch res icons, so running after sync is safe.
          #
          # 1. Render the @capacitor/assets source images from the canonical
          #    public/ SVGs so the launcher icon stays in lockstep with the
          #    favicon / PWA icons:
          #      assets/icon-foreground.png + icon-background.png -> adaptive icon
          #      assets/icon-only.png                            -> legacy (pre-API-26)
          #      assets/splash.png + splash-dark.png             -> splash
          node scripts/build-native-icons.mjs
          # 2. Generate the native resources. Use the pinned, already-installed
          #    @capacitor/assets (via the cap:assets script) rather than a
          #    `pnpm dlx` fetch — that download pulled an unbuilt copy of sharp
          #    and is a network/version flake on every build.
          pnpm cap:assets
          # Sanity check: fail loudly if the launcher icons weren't written.
          ls android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png
          # 3. Fix @capacitor/assets' adaptive-icon output. On API 26+ (every
          #    modern phone) the launcher uses mipmap-anydpi-v26/ic_launcher.xml,
          #    and @capacitor/assets v3 writes it with a 16.7% <inset> on BOTH
          #    the background and foreground layers. That's wrong for the
          #    background: an adaptive icon's background must fill the whole
          #    108dp cell because the launcher masks it to a circle/squircle —
          #    inset, it renders as a small black square floating on transparent
          #    corners instead of the full Relay disc, and the doubly-inset
          #    foreground shrinks the "R" to a dot. It also leaves the scaffold's
          #    values/ic_launcher_background.xml at #FFFFFF. Overwrite both
          #    anydpi icons with the clean, full-bleed form (brand-black
          #    background colour + non-inset "R" foreground — our
          #    icon-foreground SVG already carries the safe-zone margin) so the
          #    launcher icon matches the favicon / PWA icon. Without this the
          #    icon still looks broken even though cap:assets "succeeded".
          RES=android/app/src/main/res
          cat > "$RES/values/ic_launcher_background.xml" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#0A0A0A</color>
          </resources>
          XML
          for f in ic_launcher.xml ic_launcher_round.xml; do
            cat > "$RES/mipmap-anydpi-v26/$f" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background" />
              <foreground android:drawable="@mipmap/ic_launcher_foreground" />
          </adaptive-icon>
          XML
          done
          echo "Rewrote adaptive-icon XML to full-bleed brand background:"
          cat "$RES/mipmap-anydpi-v26/ic_launcher.xml"

      - name: Bump versionCode + versionName from git
        working-directory: packages/relay-ui/android/app
        env:
          OVERRIDE_VC: ${{ github.event.inputs.version_code }}
        run: |
          set -euo pipefail
          # versionCode rules:
          #   1. Must be a positive integer that strictly increases per AAB
          #      submitted to Play Console (Play rejects duplicates).
          #   2. Max 2,100,000,000 (Play limit).
          #
          # We derive it as minutes-since-2024-01-01-UTC. That always
          # increases, stays well under the cap (50M for the next ~3000
          # years), and doesn't depend on github.run_number, which can
          # repeat if you re-run the same workflow run.
          #
          # The workflow_dispatch input version_code can override this
          # in case you ever need to bump past a specific value.
          if [ -n "${OVERRIDE_VC:-}" ]; then
            VC="$OVERRIDE_VC"
          else
            EPOCH_2024=1704067200  # 2024-01-01T00:00:00Z
            NOW=$(date -u +%s)
            VC=$(( (NOW - EPOCH_2024) / 60 ))
          fi

          SHORT_SHA=$(git -C "$GITHUB_WORKSPACE" rev-parse --short HEAD)
          VN="0.1.0+${SHORT_SHA}"

          echo "Using versionCode=${VC} versionName=${VN}"
          sed -i -E "s/(versionCode )[0-9]+/\1${VC}/" build.gradle
          sed -i -E "s/(versionName )\".*\"/\1\"${VN}\"/" build.gradle
          grep -E "versionCode|versionName" build.gradle

      - name: Decode keystore (release builds only)
        if: ${{ github.event.inputs.build_type == 'release-aab' }}
        env:
          KS_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KS_BASE64:-}" ]; then
            echo "ERROR: ANDROID_KEYSTORE_BASE64 secret is not set. Run the 'Initialize Android upload keystore' workflow first." >&2
            exit 1
          fi
          echo "$KS_BASE64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"
          chmod 600 "$RUNNER_TEMP/upload-keystore.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload-keystore.jks" >> "$GITHUB_ENV"

      - name: Inject signing config into Gradle (release builds only)
        if: ${{ github.event.inputs.build_type == 'release-aab' }}
        working-directory: packages/relay-ui/android/app
        run: |
          set -euo pipefail
          # Capacitor's generated build.gradle has no signingConfig.
          # Append the overlay (under .github/) which adds a release
          # signingConfig that reads from env vars set below. Idempotent
          # via a marker comment in the overlay file.
          if ! grep -q "RELAY_SIGNING_CONFIG_INJECTED" build.gradle; then
            cat "$GITHUB_WORKSPACE/.github/android-signing-overlay.gradle" >> build.gradle
          fi

      - name: Gradle assemble debug APK
        if: ${{ github.event.inputs.build_type == 'debug-apk' }}
        working-directory: packages/relay-ui/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Gradle bundle release AAB
        if: ${{ github.event.inputs.build_type == 'release-aab' }}
        working-directory: packages/relay-ui/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: relay-android-${{ github.event.inputs.build_type }}
          path: |
            packages/relay-ui/android/app/build/outputs/apk/**/*.apk
            packages/relay-ui/android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: error
          retention-days: 14

      - name: Upload AAB to Play Console (Internal Testing)
        if: ${{ github.event.inputs.build_type == 'release-aab' && github.event.inputs.publish == 'true' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.averrow.relay
          releaseFiles: packages/relay-ui/android/app/build/outputs/bundle/release/*.aab
          # `tracks` (plural) is the current input; the singular `track` still
          # works on @v1 but prints a deprecation warning as a run annotation.
          # Single track name, same value.
          tracks: internal
          # `completed` rolls the release straight out to the Internal testing
          # track, so enrolled testers just get the update in the Play Store —
          # no manual "promote the draft" step in the Play Console. (`draft`
          # only stages an edit you must publish by hand.) Internal testing
          # has no Google review gate, so this is immediate. Requires the
          # app-content declarations (Data safety, Content rating, etc.) to be
          # complete — if they aren't, Play rejects the rollout and this step
          # fails loudly (a draft would have silently succeeded); complete them
          # once in the Console and re-run.
          status: completed
